[project]
name = "scribd-downloader"
version = "0.1.0"
description = "Download Scribd documents preserving page images, fonts and text layout"
readme = "README.md"
authors = [
    { name = "lain", email = "lain" }
]
requires-python = ">=3.13"
dependencies = [
    "img2pdf>=0.6.3",
    "curl-cffi>=0.17.0",
    "lxml>=6.1.3",
    "pillow>=13.0.0",
    "pikepdf>=10.0.0",
    "quickjs-ng>=0.17.0.2",
    "reportlab>=4.4.0",
    "scrapling[fetchers]>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pypdf>=6.21.4",
    "pypdfium2>=5.15.2",
]

[project.scripts]
scribd-downloader = "scribd_downloader.__main__:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
